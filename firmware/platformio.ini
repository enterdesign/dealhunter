; Waveshare ESP32-S3-Touch-LCD-7B (1024x600, GT911). NOT yet built on real hardware.
[env:waveshare_s3_lcd7]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi   ; 8 MB octal PSRAM
board_build.flash_mode = qio
board_upload.flash_size = 8MB
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1            ; native USB (TinyUSB): CDC serial + HID keyboard
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
  lvgl/lvgl@^8.3.11
  ; Waveshare/Espressif panel + touch drivers for this board, see board.cpp
